        function placeGLBModel(gltf, cfg) {
            const model = gltf.scene;
            const rawSize = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
            if (rawSize.y <= 0) return;
            const scale = cfg.height / rawSize.y;
            model.scale.setScalar(scale);
            model.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const holder = new THREE.Group();
            holder.add(model);
            model.position.set(-center.x, -box.min.y, -center.z);
            model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
            holder.position.set(cfg.pos[0], cfg.pos[1] ?? 0, cfg.pos[2]);
            holder.rotation.y = cfg.rotationY || 0;
            scene.add(holder);
            registerInteractable(holder, {
                id: cfg.id, name: cfg.name, desc: cfg.desc, activate: () => {}
            });
            applySavedTo(cfg.id, holder);
            refreshColliders();
        }
        function loadGLBModels() {
            const loader = new GLTFLoader();
            GLB_MODELS.forEach(cfg => {
                loader.load(encodeURI(cfg.file), (gltf) => {
                    placeGLBModel(gltf, cfg);
                }, undefined, () => {
                    console.warn('GLB 加载失败：', cfg.file);
                });
            });
        }

        // ---------- Position save / load ----------
        const SAVE_KEY = 'christmas_room_positions_v1';
        let savedPositions = {};
        function loadSavedPositions() {
            try { savedPositions = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch (e) { savedPositions = {}; }
        }
        function savePositions() {
            const data = {};
            interactables.forEach(i => {
                const g = i.group;
                data[i.id] = { x: g.position.x, y: g.position.y, z: g.position.z, ry: g.rotation.y };
            });
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
        }
        function applySavedPositions() {
            for (const i of interactables) {
                const p = savedPositions[i.id];
                if (p) {
                    i.group.position.set(p.x ?? 0, p.y ?? 0, p.z ?? 0);
                    i.group.rotation.y = p.ry ?? 0;
                }
            }
        }
        function applySavedTo(id, group) {
            const p = savedPositions[id];
            if (p) { group.position.set(p.x, p.y, p.z); group.rotation.y = p.ry ?? 0; }
        }
        function resetPositions() {
            try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
            location.reload();
        }

        // ---------- First-person mode ----------
        function refreshColliders() {
            activeColliders = [];
            for (const i of interactables) {
                if (!SOLID_IDS.includes(i.id)) continue;
                const box = new THREE.Box3().setFromObject(i.group);
                if (box.isEmpty()) continue;
                activeColliders.push({ minX: box.min.x, maxX: box.max.x, minZ: box.min.z, maxZ: box.max.z });
            }
        }

        function collidesPoint(x, z) {
            if (x < -21.3 || x > 21.3 || z < -13.3 || z > 13.3) return true;
            for (const c of activeColliders) {
                if (x > c.minX - PLAYER.radius && x < c.maxX + PLAYER.radius &&
                    z > c.minZ - PLAYER.radius && z < c.maxZ + PLAYER.radius) return true;
            }
            return false;
        }

        function getInteractableAtCenter() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(interactables.map(i => i.group), true);
            if (hits.length) {
                const root = getInteractableRoot(hits[0].object);
                return interactables.find(i => i.group === root) || null;
            }
            return null;
        }

        function fpsInteract() {
            const target = getInteractableAtCenter();
            if (target) { target.activate(); showInfo(target.name, target.desc); }
        }

        function enterFPS() {
            if (moveModeActive) setMoveMode(false);
            currentMode = MODE.FPS;
            controls.enabled = false;
            camera.position.set(0, PLAYER.height, 12);
            camera.lookAt(0, PLAYER.height, -10);
            if (fpsHands) fpsHands.visible = true;
            document.getElementById('fps-overlay').classList.remove('show');
            fpsControls.lock();
        }

        function exitFPS() {
            currentMode = MODE.ORBIT;
            if (fpsControls && fpsControls.isLocked) fpsControls.unlock();
            controls.enabled = true;
            if (fpsHands) fpsHands.visible = false;
            walkAmount = 0;
            document.getElementById('crosshair').classList.remove('show');
            document.getElementById('fps-overlay').classList.remove('show');
            document.getElementById('fps-target').classList.remove('show');
            document.getElementById('fps-btn').classList.remove('active');
        }

        function toggleMode() {
            if (currentMode === MODE.FPS) exitFPS(); else enterFPS();
        }

        function buildFPSHands() {
            fpsHands = new THREE.Group();
            camera.add(fpsHands);

            const sleeveMat = standard(0xcc2233);
            const gloveMat = standard(0xf0c8a0);
            const trimMat = standard(0xf5f0e0);

            // 两只手臂 + 手掌（左右对称，从画面两侧伸向中间）
            const makeArm = (side) => {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.85, 12), sleeveMat);
                arm.position.set(0.5 * side, -0.55, -0.9);
                arm.rotation.set(0.5, -0.5 * side, 0.12 * side);
                fpsHands.add(arm);

                const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.12, 12), trimMat);
                cuff.position.set(0.34 * side, -0.35, -0.74);
                cuff.rotation.set(0.5, -0.5 * side, 0.12 * side);
                fpsHands.add(cuff);

                const hand = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), gloveMat);
                hand.scale.set(1, 0.85, 1.2);
                hand.position.set(0.24 * side, -0.14, -0.58);
                fpsHands.add(hand);
            };
            makeArm(1);
            makeArm(-1);

            // 双手捧着的礼物盒（带绑带装饰）
            const gift = new THREE.Group();
            const boxMat = standard(0xcc2233);
            const ribbonMat = glossy(0xf5f0e0);
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), boxMat);
            gift.add(box);
            // 横向绑带（绕 X 轴一圈）
            const bandX = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.12, 0.42), ribbonMat);
            gift.add(bandX);
            // 纵向绑带（绕 Z 轴一圈）
            const bandZ = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 0.42), ribbonMat);
            gift.add(bandZ);
            // 顶部蝴蝶结
            const bowL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.12), ribbonMat);
            bowL.position.set(0, 0.24, 0); bowL.rotation.z = 0.5; gift.add(bowL);
            const bowR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.12), ribbonMat);
            bowR.position.set(0, 0.24, 0); bowR.rotation.z = -0.5; gift.add(bowR);
            const knot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), ribbonMat);
            knot.position.set(0, 0.24, 0); gift.add(knot);
            gift.position.set(0, -0.2, -0.62);
            fpsHands.add(gift);

            // 整体缩小，避免遮挡画面；并稍微后移，防止缩小时贴近镜头
            fpsHands.scale.setScalar(0.55);
            fpsHands.position.z = -0.3;

            fpsHands.visible = false;
        }

        function updateFPSHands(dt, phase, amount) {
            if (!fpsHands) return;
            fpsHands.position.y = Math.sin(phase * 2) * 0.04 * amount;
            fpsHands.position.x = Math.cos(phase) * 0.02 * amount;
            fpsHands.rotation.z = Math.cos(phase) * 0.04 * amount;
        }

        function updateFPS(dt) {
            if (!fpsControls.isLocked) return;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3().crossVectors(forward, UP);

            const ix = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
            const iz = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
            const dir = new THREE.Vector3();
            dir.addScaledVector(right, ix).addScaledVector(forward, iz);
            const moving = dir.lengthSq() > 0;
            if (moving) dir.normalize();
            const speed = 5.0;
            const nx = camera.position.x + dir.x * speed * dt;
            const nz = camera.position.z + dir.z * speed * dt;
            if (!collidesPoint(nx, camera.position.z)) camera.position.x = nx;
            if (!collidesPoint(camera.position.x, nz)) camera.position.z = nz;

            // 行走动态：镜头上下晃动 + 手臂摆动
            walkAmount += ((moving ? 1 : 0) - walkAmount) * Math.min(1, dt * 6);
            if (moving) walkPhase += dt * 9.0;
            const bobY = Math.sin(walkPhase * 2) * 0.055 * walkAmount;
            camera.position.y = PLAYER.height + bobY;
            updateFPSHands(dt, walkPhase, walkAmount);

            const target = getInteractableAtCenter();
            const label = document.getElementById('fps-target');
            fpsTargetRef = target;
            if (target) { label.textContent = target.name + ' · 点击 / E 互动'; label.classList.add('show'); }
            else label.classList.remove('show');
        }

        function setupFPSEvents() {
            const overlay = document.getElementById('fps-overlay');
            const crosshair = document.getElementById('crosshair');
            const btn = document.getElementById('fps-btn');

            fpsControls.addEventListener('lock', () => {
                currentMode = MODE.FPS;
                overlay.classList.remove('show');
                crosshair.classList.add('show');
                btn.classList.add('active');
            });
            fpsControls.addEventListener('unlock', () => {
                if (currentMode === MODE.FPS) {
                    overlay.classList.add('show');
                    crosshair.classList.remove('show');
                    document.getElementById('fps-target').classList.remove('show');
                }
            });

            btn.addEventListener('click', toggleMode);
            document.getElementById('fps-resume').addEventListener('click', () => fpsControls.lock());
            document.getElementById('fps-exit').addEventListener('click', exitFPS);

            document.addEventListener('mousedown', (e) => {
                if (currentMode === MODE.FPS && fpsControls.isLocked && e.button === 0) fpsInteract();
            });
        }

        // ---------- Init ----------
        function init() {
            loadSavedPositions();

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e1a);
            scene.fog = new THREE.FogExp2(0x0a0e1a, 0.012);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 9, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            container.appendChild(renderer.domElement);

            const pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 6, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 12;
            controls.maxDistance = 42;
            controls.maxPolarAngle = Math.PI * 0.52;
            controls.minPolarAngle = Math.PI * 0.12;
            controls.update();

            fpsControls = new PointerLockControls(camera, renderer.domElement);
            setupFPSEvents();

            // 第一人称手部：作为相机的子物体，随视角移动
            scene.add(camera);
            buildFPSHands();

            createAllTextures();
            setupLights();

            scene.add(buildRoom());
            scene.add(buildTree());
            scene.add(buildRadio());
            scene.add(buildRug());
            scene.add(buildReindeer());
            scene.add(buildSanta());
            scene.add(buildWardrobe());
            scene.add(buildBookshelf());
            scene.add(buildTV());
            // scene.add(buildAlbum());
            scene.add(buildClock());
            scene.add(buildStockings());
            scene.add(buildSofa());
            scene.add(buildFrames());
            scene.add(buildSparkles());

            // 移动模式高亮圈
            moveRing = new THREE.Mesh(
                new THREE.RingGeometry(0.7, 1.0, 32),
                new THREE.MeshBasicMaterial({ color: 0xffd94a, side: THREE.DoubleSide, transparent: true, opacity: 0.55, depthWrite: false })
            );
            moveRing.rotation.x = -Math.PI / 2;
            moveRing.visible = false;
            scene.add(moveRing);

            setupEvents();
            setupLightingUI();

            applySavedPositions();
            refreshColliders();
            loadGLBModels();

            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 900);

            animate();
        }

        // ---------- Animation ----------
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const t = clock.elapsedTime;

            if (currentMode === MODE.FPS) {
                updateFPS(dt);
            } else {
                controls.update();
            }

            // Star spin
            if (animParts.star) animParts.star.rotation.y += dt * 1.5;

            // Tree & garland lights twinkle
            treeLights.forEach(l => {
                const v = 0.5 + 0.5 * Math.sin(t * 3 + l.userData.phase);
                l.material.emissiveIntensity = 0.3 + v * 1.8;
            });

            // Fireplace flicker
            const fireMul = lightMultiplier('fireplace');
            fireFlicker.flames.forEach((f, i) => {
                const s = 0.85 + 0.3 * Math.sin(t * 10 + i * 1.7);
                f.scale.set(s, 1 + 0.25 * Math.sin(t * 13 + i * 2.1), s);
                f.position.y = 2.0 + Math.sin(t * 9 + i) * 0.12;
            });
            const boost = fireFlicker.boost || 0;
            fireFlicker.light.intensity = fireFlicker.base * fireMul * (0.85 + 0.3 * Math.sin(t * 12) + boost);
            if (boost > 0) fireFlicker.boost = Math.max(0, boost - dt * 0.8);
            (fireFlicker.flameMats || []).forEach(({ mat, base }) => {
                mat.opacity = base * Math.min(1, Math.max(0, fireMul));
            });

            // Radio bounce
            if (animParts.radioBounce) {
                const p = animParts.radio;
                p.position.y = 1.5 + Math.abs(Math.sin(t * 10)) * 0.15 * animParts.radioBounce;
                p.rotation.z = Math.sin(t * 12) * 0.06 * animParts.radioBounce;
                animParts.radioBounce = Math.max(0, animParts.radioBounce - dt * 0.4);
                if (animParts.radioBounce === 0) { p.position.y = 1.5; p.rotation.z = 0; }
            }

            // Reindeer nod
            if (animParts.reindeerNod) {
                const h = animParts.reindeerHead;
                h.rotation.x = Math.sin(t * 8) * 0.35 * animParts.reindeerNod;
                animParts.reindeerNod = Math.max(0, animParts.reindeerNod - dt * 0.5);
                if (animParts.reindeerNod === 0) h.rotation.x = 0;
            }
            if (animParts.reindeerNose) {
                animParts.reindeerNose.material.emissiveIntensity = 1.2 + 0.8 * Math.sin(t * 5);
            }

            // Santa wave
            if (animParts.santaWave) {
                const arm = animParts.santaRightArm;
                arm.rotation.z = -0.5 + Math.sin(t * 12) * 0.7 * animParts.santaWave;
                arm.rotation.x = Math.sin(t * 10) * 0.2 * animParts.santaWave;
                animParts.santaWave = Math.max(0, animParts.santaWave - dt * 0.4);
                if (animParts.santaWave === 0) { arm.rotation.z = -0.5; arm.rotation.x = 0; }
            }

            // Wardrobe door
            if (animParts.wardrobe) {
                const w = animParts.wardrobe;
                w.current += (w.target - w.current) * Math.min(1, dt * 4);
                w.leftDoor.rotation.y = -w.current * 1.9;
                w.rightDoor.rotation.y = w.current * 1.9;
            }

            // TV flicker
            if (animParts.tv && animParts.tv.on) {
                animParts.tv.screen.material.color.setScalar(0.88 + 0.12 * Math.sin(t * 28));
            }

            // Album page flip
            if (animParts.album) {
                const a = animParts.album;
                if (a.flipping) {
                    a.flip += dt * 2.0;
                    a.pageGroup.rotation.z = -Math.PI * Math.min(1, a.flip);
                    if (a.flip >= 1) {
                        a.flip = 0;
                        a.flipping = false;
                        a.pageGroup.rotation.z = 0;
                        a.leftMat.map = a.photos[a.idx];
                        a.leftMat.needsUpdate = true;
                        a.idx = (a.idx + 1) % a.photos.length;
                        a.rightMat.map = a.photos[a.idx];
                        a.rightMat.needsUpdate = true;
                    }
                }
            }

            // Clock hands
            if (animParts.clock) {
                const now = new Date();
                const sec = now.getSeconds();
                const min = now.getMinutes() + sec / 60;
                const hr = (now.getHours() % 12) + min / 60;
                animParts.clock.minute.rotation.z = -(min / 60) * Math.PI * 2;
                animParts.clock.hour.rotation.z = -(hr / 12) * Math.PI * 2;
            }

            // Sofa bounce
            if (animParts.sofaBounce) {
                const b = animParts.sofaBase;
                b.scale.y = 1 + Math.abs(Math.sin(t * 14)) * 0.06 * animParts.sofaBounce;
                animParts.sofaBounce = Math.max(0, animParts.sofaBounce - dt * 0.5);
                if (animParts.sofaBounce === 0) b.scale.y = 1;
            }

            updateSparkles(dt, t);
            renderer.render(scene, camera);
        }

        init();
    </script>
