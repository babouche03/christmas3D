<!--
  - @Project: Christmas Room - 3D Interactive Holiday Room
  - @Description: A full 3D Christmas room built with Three.js (procedural modeling).
  -               Click the Christmas tree to enter the particle-tree page.
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圣诞房间 - Christmas Room</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0a0e1a;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Times New Roman', serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #canvas-container { position: absolute; inset: 0; z-index: 1; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        #canvas-container.grab-hover { cursor: pointer; }

        /* Loader */
        #loader {
            position: absolute; inset: 0; z-index: 100;
            background: radial-gradient(circle at center, #12203a 0%, #070b16 70%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.9s ease-out;
        }
        .loader-title {
            color: #fceea7; font-size: 26px; letter-spacing: 8px; font-weight: 400;
            text-shadow: 0 0 40px rgba(252, 238, 167, 0.6);
        }
        .loader-sub { color: #d4af37; font-size: 12px; letter-spacing: 4px; margin-top: 16px; opacity: 0.8; }
        .spinner {
            margin-top: 28px; width: 42px; height: 42px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid #d4af37; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Title */
        #title {
            position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        #title h1 {
            font-family: 'Cinzel', 'Times New Roman', serif;
            color: #fceea7; font-size: 30px; font-weight: 400; letter-spacing: 8px;
            background: linear-gradient(to bottom, #fff, #eebb66);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(252,238,167,0.5);
            margin-bottom: 6px;
        }
        #title p { color: rgba(252,238,167,0.7); font-size: 12px; letter-spacing: 3px; }
        @media (max-width: 640px) { #title h1 { font-size: 24px; } }

        /* Hint bottom */
        #hint {
            position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; color: rgba(255,255,255,0.55);
            font-size: 12px; letter-spacing: 1px; text-align: center;
            background: rgba(0,0,0,0.35); padding: 8px 18px; border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* Info panel */
        #info-panel {
            position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px);
            z-index: 20; min-width: 240px; max-width: 88vw;
            background: rgba(10, 16, 30, 0.82);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 12px; padding: 16px 20px;
            color: #fceea7; text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            opacity: 0; pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        #info-panel.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #info-panel .name {
            font-size: 18px; letter-spacing: 2px; font-weight: 600; margin-bottom: 6px;
        }
        #info-panel .desc { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.5; }

        /* Navigation overlay (fade out to particle page) */
        #nav-overlay {
            position: absolute; inset: 0; z-index: 90;
            background: radial-gradient(circle at center, #0f2027 0%, #050d1a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.7s ease;
        }
        #nav-overlay.show { opacity: 1; pointer-events: auto; }
        #nav-overlay .nav-text { color: #d4af37; letter-spacing: 5px; font-size: 15px; }

        /* Lighting control */
        #light-toggle {
            position: absolute; top: 24px; right: 24px; z-index: 40;
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(15, 22, 38, 0.75); border: 1px solid rgba(212,175,55,0.5);
            color: #ffd94a; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); transition: all 0.3s;
        }
        #light-toggle:hover { box-shadow: 0 0 18px rgba(212,175,55,0.5); transform: scale(1.05); }
        #light-toggle.active { background: rgba(212,175,55,0.85); color: #1a1200; }

        #light-panel {
            position: absolute; top: 82px; right: 24px; z-index: 40;
            width: 260px; max-height: 76vh; overflow-y: auto;
            background: rgba(10, 16, 30, 0.88);
            border: 1px solid rgba(212,175,55,0.35); border-radius: 14px;
            padding: 16px; color: #fceea7;
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 44px rgba(0,0,0,0.6);
            transform: translateX(320px); opacity: 0; pointer-events: none;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }
        #light-panel.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
        #light-panel h3 {
            font-size: 14px; letter-spacing: 2px; font-weight: 600; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        #light-panel h3 span { cursor: pointer; opacity: 0.7; font-size: 18px; }
        .lp-block { margin-bottom: 14px; }
        .lp-label { font-size: 11px; letter-spacing: 1px; color: rgba(252,238,167,0.8); margin-bottom: 6px; display: flex; justify-content: space-between; }
        .lp-label .val { color: #fff; font-family: monospace; }
        .lp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .lp-row .lg-name { flex: 1; font-size: 12px; letter-spacing: 1px; }
        .lp-switch {
            width: 34px; height: 18px; border-radius: 9px; background: #334;
            position: relative; cursor: pointer; transition: background 0.25s; flex-shrink: 0;
        }
        .lp-switch.on { background: #d4af37; }
        .lp-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
            border-radius: 50%; background: #fff; transition: left 0.25s;
        }
        .lp-switch.on::after { left: 18px; }
        input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
            border-radius: 2px; background: rgba(255,255,255,0.18); outline: none; margin: 6px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: #ffd94a; cursor: pointer; border: none;
        }
        input[type="color"] {
            width: 30px; height: 22px; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px; background: transparent; padding: 0; cursor: pointer; flex-shrink: 0;
        }
        .lp-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
        .lp-preset {
            background: rgba(255,255,255,0.07); border: 1px solid rgba(212,175,55,0.3);
            color: #fceea7; padding: 7px 0; border-radius: 8px; cursor: pointer;
            font-size: 12px; letter-spacing: 1px; transition: all 0.2s;
        }
        .lp-preset:hover { background: rgba(212,175,55,0.25); }
        .lp-preset.active { background: #d4af37; color: #1a1200; }

        /* First-person mode */
        #fps-btn {
            position: absolute; top: 24px; right: 80px; z-index: 40;
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(15, 22, 38, 0.75); border: 1px solid rgba(212,175,55,0.5);
            color: #fceea7; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); transition: all 0.3s;
        }
        #fps-btn:hover { box-shadow: 0 0 18px rgba(212,175,55,0.5); transform: scale(1.05); }
        #fps-btn.active { background: rgba(212,175,55,0.85); color: #1a1200; }
        #move-btn {
            position: absolute; top: 24px; right: 136px; z-index: 40;
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(15, 22, 38, 0.75); border: 1px solid rgba(212,175,55,0.5);
            color: #fceea7; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); transition: all 0.3s;
        }
        #move-btn:hover { box-shadow: 0 0 18px rgba(212,175,55,0.5); transform: scale(1.05); }
        #move-btn.active { background: rgba(212,175,55,0.85); color: #1a1200; }
        #move-hint {
            position: absolute; top: 82px; left: 50%; transform: translateX(-50%);
            z-index: 25; pointer-events: none; color: #fff; font-size: 13px;
            letter-spacing: 1px; background: rgba(212,175,55,0.9); color: #1a1200;
            padding: 8px 18px; border-radius: 20px; opacity: 0; transition: opacity 0.25s;
        }
        #move-hint.show { opacity: 1; }
        #canvas-container.move-mode { cursor: move; }
        #save-toolbar {
            position: absolute; top: 24px; left: 24px; z-index: 40;
            display: flex; gap: 8px;
        }
        #save-toolbar button {
            background: rgba(15, 22, 38, 0.75); border: 1px solid rgba(212,175,55,0.5);
            color: #fceea7; padding: 9px 14px; border-radius: 8px; cursor: pointer;
            font-size: 12px; letter-spacing: 1px; backdrop-filter: blur(8px); transition: all 0.2s;
        }
        #save-toolbar button:hover { background: #d4af37; color: #1a1200; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            margin: -4px 0 0 -4px; border-radius: 50%; background: #fff;
            z-index: 30; pointer-events: none; display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.9);
        }
        #crosshair.show { display: block; }
        #fps-target {
            position: absolute; top: 57%; left: 50%; transform: translateX(-50%);
            z-index: 30; pointer-events: none; color: #fff; font-size: 13px;
            letter-spacing: 1px; background: rgba(0,0,0,0.55); padding: 5px 12px;
            border-radius: 14px; opacity: 0; transition: opacity 0.2s; white-space: nowrap;
        }
        #fps-target.show { opacity: 1; }
        #fps-overlay {
            position: absolute; inset: 0; z-index: 35; display: flex;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none;
            transition: opacity 0.25s;
        }
        #fps-overlay.show { opacity: 1; pointer-events: auto; }
        .fps-panel {
            text-align: center; color: #fceea7;
            background: rgba(10, 16, 30, 0.9); border: 1px solid rgba(212,175,55,0.5);
            padding: 28px 36px; border-radius: 14px; box-shadow: 0 12px 44px rgba(0,0,0,0.6);
        }
        .fps-panel h2 { font-size: 20px; letter-spacing: 3px; margin-bottom: 10px; font-weight: 500; }
        .fps-panel p { font-size: 13px; color: rgba(255,255,255,0.75); margin-bottom: 18px; }
        .fps-actions { display: flex; gap: 12px; justify-content: center; }
        .fps-actions button {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(212,175,55,0.5);
            color: #fceea7; padding: 10px 22px; border-radius: 8px; cursor: pointer;
            font-size: 14px; letter-spacing: 1px; transition: all 0.2s;
        }
        .fps-actions button:hover { background: #d4af37; color: #1a1200; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="loader-title">MERRY CHRISTMAS</div>
        <div class="loader-sub">正在布置圣诞房间...</div>
        <div class="spinner"></div>
    </div>

    <div id="nav-overlay">
        <div class="nav-text">进入粒子圣诞树...</div>
        <div class="spinner" style="margin-top:20px;"></div>
    </div>

    <div id="title">
        <h1>叙利亚公主的90平豪华大别野</h1>
        <!-- <p>点击房间内的物件，探索节日惊喜</p> -->
    </div>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <div class="name" id="info-name"></div>
        <div class="desc" id="info-desc"></div>
    </div>

    <div id="hint">🖱️ 拖拽旋转 · 滚轮缩放 · 点击物件互动 · L 灯光 · F 第一人称 · M 移动</div>

    <input type="file" id="frame-photo-input" accept="image/*" style="display:none">

    <button id="move-btn" title="移动模式 (M)">✋</button>
    <button id="fps-btn" title="第一人称模式 (F)">🎮</button>
    <button id="light-toggle" title="灯光控制 (L)">💡</button>

    <div id="save-toolbar">
        <button id="save-pos-btn" title="保存所有物品位置">💾 保存位置</button>
        <button id="reset-pos-btn" title="重置所有物品位置">↺ 重置</button>
    </div>

    <div id="move-hint">✋ 移动模式：拖动物体 · 滚轮升降 · Q/E 旋转 · 位置自动保存 · 按 M 退出</div>

    <div id="crosshair"></div>
    <div id="fps-target"></div>
    <div id="fps-overlay">
        <div class="fps-panel">
            <h2>第一人称模式</h2>
            <p>W A S D 移动 · 鼠标环顾 · 点击 / E 键互动</p>
            <div class="fps-actions">
                <button id="fps-resume">🖱️ 点击继续</button>
                <button id="fps-exit">🚪 退出</button>
            </div>
        </div>
    </div>
    <div id="light-panel">
        <h3>灯光控制 <span id="light-close">×</span></h3>
        <div class="lp-block">
            <div class="lp-label"><span>整体亮度</span><span class="val" id="master-val">100%</span></div>
            <input type="range" id="master-slider" min="0" max="2" step="0.05" value="1">
        </div>
        <div id="light-groups"></div>
        <div class="lp-block">
            <div class="lp-label"><span>场景预设</span></div>
            <div class="lp-presets">
                <button class="lp-preset" data-preset="warm">温暖</button>
                <button class="lp-preset" data-preset="bright">明亮</button>
                <button class="lp-preset" data-preset="night">夜晚</button>
                <button class="lp-preset" data-preset="party">派对</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // ---------- Global ----------
        let scene, camera, renderer, controls, clock = new THREE.Clock();
        let raycaster = new THREE.Raycaster();
        let pointer = new THREE.Vector2();
        let pointerDown = new THREE.Vector2();
        let interactables = [];       // { group, id, name, desc, activate() }
        let animParts = {};           // stored sub-parts for idle/active animations
        let fireFlicker = { flames: [], light: null, base: 0 };
        let treeLights = [];
        let sparkles = null;

        // ---------- First-person mode state ----------
        let fpsControls = null;
        const MODE = { ORBIT: 'ORBIT', FPS: 'FPS' };
        let currentMode = MODE.ORBIT;
        const keys = {};
        const PLAYER = { height: 2.8, radius: 0.45 };
        const UP = new THREE.Vector3(0, 1, 0);
        let pendingFrameIndex = 0;
        let fpsTargetRef = null;
        let fpsHands = null;
        let walkPhase = 0;
        let walkAmount = 0;

        // ---------- Move mode state ----------
        let moveModeActive = false;
        let moveSelected = null;      // group currently being dragged
        let moveHover = null;         // group under cursor (move mode)
        let moveRing = null;          // highlight ring mesh
        let moveDrag = { active: false, plane: new THREE.Plane(), offset: new THREE.Vector3() };
        const SOLID_IDS = ['tree', 'fireplace', 'wardrobe', 'bookshelf', 'tv', 'sofa', 'radio', 'reindeer', 'santa', 'bookcase', 'bartable', 'vending', 'piano', 'pine-tree', 'santa-glb', 'gifts'];
        let activeColliders = [];

        const infoPanel = document.getElementById('info-panel');
        const infoName = document.getElementById('info-name');
        const infoDesc = document.getElementById('info-desc');
        const navOverlay = document.getElementById('nav-overlay');
        let infoTimeout = null;

        // ---------- Lighting control system ----------
        const LIGHT_GROUPS = [
            { id: 'ambient',   label: '环境光' },
            { id: 'ceiling',   label: '主吊灯' },
            { id: 'fireplace', label: '壁炉火光' },
            { id: 'tree',      label: '圣诞树灯' },
            { id: 'moon',      label: '月光' },
        ];
        const lightState = { master: 1.0, groups: {} };
        LIGHT_GROUPS.forEach(g => {
            lightState.groups[g.id] = { enabled: true, color: '#ffffff', intensity: 1.0 };
        });
        Object.assign(lightState.groups, {
            ambient:   { enabled: true, color: '#33415a', intensity: 1.0 },
            ceiling:   { enabled: true, color: '#ffd9a0', intensity: 1.0 },
            fireplace: { enabled: true, color: '#ff7733', intensity: 1.0 },
            tree:      { enabled: true, color: '#88ffbb', intensity: 1.0 },
            moon:      { enabled: true, color: '#88aaff', intensity: 1.0 },
        });

        const PRESETS = {
            warm: {
                master: 1.0,
                ambient:   { color: '#3a2c20', intensity: 0.9 },
                ceiling:   { color: '#ffd9a0', intensity: 1.0 },
                fireplace: { color: '#ff7733', intensity: 1.0 },
                tree:      { color: '#88ffbb', intensity: 0.8 },
                moon:      { color: '#88aaff', intensity: 0.5 },
            },
            bright: {
                master: 1.4,
                ambient:   { color: '#ccd6e6', intensity: 1.0 },
                ceiling:   { color: '#fff2e0', intensity: 1.2 },
                fireplace: { color: '#ff7733', intensity: 0.3 },
                tree:      { color: '#88ffbb', intensity: 0.4 },
                moon:      { color: '#88aaff', intensity: 0.2 },
            },
            night: {
                master: 0.55,
                ambient:   { color: '#1a2a55', intensity: 0.8 },
                ceiling:   { color: '#334488', intensity: 0.35 },
                fireplace: { color: '#ff7733', intensity: 1.0 },
                tree:      { color: '#44ffaa', intensity: 1.0 },
                moon:      { color: '#88ccff', intensity: 1.0 },
            },
            party: {
                master: 1.2,
                ambient:   { color: '#442266', intensity: 0.9 },
                ceiling:   { color: '#ff44cc', intensity: 1.0 },
                fireplace: { color: '#ff7733', intensity: 0.9 },
                tree:      { color: '#44ff88', intensity: 1.1 },
                moon:      { color: '#ff66aa', intensity: 0.9 },
            },
        };

        const lightRefs = {};
        function registerLight(group, light, base) {
            (lightRefs[group] = lightRefs[group] || []).push({ light, base });
        }
        function lightMultiplier(groupId) {
            const g = lightState.groups[groupId];
            return g.enabled ? g.intensity * lightState.master : 0;
        }
        function applyLighting() {
            for (const groupId in lightRefs) {
                const g = lightState.groups[groupId];
                const m = lightMultiplier(groupId);
                for (const { light, base } of lightRefs[groupId]) {
                    if (light.color && light.color.set) light.color.set(g.color);
                    light.intensity = base * m;
                }
            }
            if (animParts.ceilingEmissive) {
                const m = Math.max(0, Math.min(1.3, lightMultiplier('ceiling')));
                animParts.ceilingEmissive.forEach(e => { e.mat.emissiveIntensity = e.base * m; });
            }
        }

        let uiRefs = { groups: {} };
        function buildLightUI() {
            const container = document.getElementById('light-groups');
            LIGHT_GROUPS.forEach(g => {
                const block = document.createElement('div');
                block.className = 'lp-block';
                block.style.marginBottom = '10px';

                const row = document.createElement('div');
                row.className = 'lp-row';
                const name = document.createElement('div');
                name.className = 'lg-name'; name.textContent = g.label;
                const sw = document.createElement('div');
                sw.className = 'lp-switch on'; sw.title = '开/关';
                const color = document.createElement('input');
                color.type = 'color'; color.value = lightState.groups[g.id].color;
                row.appendChild(name); row.appendChild(sw); row.appendChild(color);

                const inten = document.createElement('input');
                inten.type = 'range'; inten.min = '0'; inten.max = '2'; inten.step = '0.05';
                inten.value = lightState.groups[g.id].intensity;

                block.appendChild(row); block.appendChild(inten);
                container.appendChild(block);

                const gid = g.id;
                sw.addEventListener('click', () => {
                    lightState.groups[gid].enabled = !lightState.groups[gid].enabled;
                    sw.classList.toggle('on', lightState.groups[gid].enabled);
                    applyLighting();
                });
                color.addEventListener('input', () => {
                    lightState.groups[gid].color = color.value;
                    applyLighting();
                });
                inten.addEventListener('input', () => {
                    lightState.groups[gid].intensity = parseFloat(inten.value);
                    applyLighting();
                });
                uiRefs.groups[gid] = { sw, color, inten };
            });
        }

        function syncLightUI() {
            const master = document.getElementById('master-slider');
            master.value = lightState.master;
            document.getElementById('master-val').textContent = Math.round(lightState.master * 100) + '%';
            for (const gid in uiRefs.groups) {
                const g = lightState.groups[gid];
                const u = uiRefs.groups[gid];
                u.sw.classList.toggle('on', g.enabled);
                u.color.value = g.color;
                u.inten.value = g.intensity;
            }
        }

        function applyPreset(name) {
            const p = PRESETS[name];
            if (!p) return;
            lightState.master = p.master;
            for (const gid in p) {
                if (gid === 'master') continue;
                const g = lightState.groups[gid];
                if (!g) continue;
                if (p[gid].color !== undefined) g.color = p[gid].color;
                if (p[gid].intensity !== undefined) g.intensity = p[gid].intensity;
                if (p[gid].enabled !== undefined) g.enabled = p[gid].enabled;
            }
            applyLighting();
            syncLightUI();
            document.querySelectorAll('.lp-preset').forEach(b =>
                b.classList.toggle('active', b.dataset.preset === name));
        }

        function setupLightingUI() {
            buildLightUI();
            const toggle = document.getElementById('light-toggle');
            const panel = document.getElementById('light-panel');
            const close = document.getElementById('light-close');
            const open = () => { panel.classList.add('open'); toggle.classList.add('active'); };
            const closeFn = () => { panel.classList.remove('open'); toggle.classList.remove('active'); };
            toggle.addEventListener('click', () => panel.classList.contains('open') ? closeFn() : open());
            close.addEventListener('click', closeFn);

            const master = document.getElementById('master-slider');
            master.addEventListener('input', () => {
                lightState.master = parseFloat(master.value);
                document.getElementById('master-val').textContent = Math.round(lightState.master * 100) + '%';
                applyLighting();
            });
            document.querySelectorAll('.lp-preset').forEach(b =>
                b.addEventListener('click', () => applyPreset(b.dataset.preset)));
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'l') panel.classList.contains('open') ? closeFn() : open();
            });
            applyPreset('warm');
        }

        // ---------- Textures (procedural) ----------
        function makeCanvasTexture(w, h, draw) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            draw(ctx, w, h);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 4;
            return tex;
        }

        const textures = {};
        function createAllTextures() {
            // Wood floor planks
            textures.floor = makeCanvasTexture(512, 512, (ctx, w, h) => {
                ctx.fillStyle = '#6b4423'; ctx.fillRect(0, 0, w, h);
                const rows = 8;
                for (let r = 0; r < rows; r++) {
                    const y = (r / rows) * h;
                    const shade = 0.85 + Math.random() * 0.3;
                    ctx.fillStyle = `rgb(${Math.floor(120 * shade)}, ${Math.floor(76 * shade)}, ${Math.floor(42 * shade)})`;
                    ctx.fillRect(0, y, w, h / rows - 3);
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.fillRect(0, y + h / rows - 3, w, 3);
                }
            });
            textures.floor.wrapS = textures.floor.wrapT = THREE.RepeatWrapping;
            textures.floor.repeat.set(3, 3);

            // Wallpaper stripes
            textures.wall = makeCanvasTexture(256, 256, (ctx, w, h) => {
                ctx.fillStyle = '#7a1f2b'; ctx.fillRect(0, 0, w, h);
                for (let i = 0; i < 8; i++) {
                    ctx.fillStyle = 'rgba(0,0,0,0.08)';
                    ctx.fillRect(i * 32, 0, 16, h);
                }
                ctx.fillStyle = 'rgba(212,175,55,0.10)';
                for (let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, Math.random() * h, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Rug pattern (concentric rings + snowflake motif)
            textures.rug = makeCanvasTexture(512, 512, (ctx, w, h) => {
                ctx.fillStyle = '#7c1f2b'; ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                const rings = [
                    [240, '#2e6b2e'], [200, '#7c1f2b'], [160, '#d4af37'],
                    [120, '#2e6b2e'], [80, '#7c1f2b'], [40, '#f5f0e0']
                ];
                rings.forEach(([r, col]) => {
                    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                });
                ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4;
                for (const [r] of rings) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
                // snowflakes
                ctx.fillStyle = '#f5f0e0';
                for (let i = 0; i < 16; i++) {
                    const a = Math.random() * Math.PI * 2, rr = Math.random() * 200 + 20;
                    ctx.save(); ctx.translate(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
                    ctx.rotate(Math.random() * Math.PI);
                    ctx.fillRect(-1.5, -10, 3, 20); ctx.fillRect(-10, -1.5, 20, 3);
                    ctx.restore();
                }
            });
        }

        // ---------- Materials ----------
        function standard(color, opts = {}) {
            return new THREE.MeshStandardMaterial({
                color, roughness: 0.85, metalness: 0.0, ...opts
            });
        }
        function glossy(color, opts = {}) {
            return new THREE.MeshStandardMaterial({
                color, roughness: 0.25, metalness: 0.7, envMapIntensity: 1.0, ...opts
            });
        }
        function emissive(color, intensity = 1.0, baseColor) {
            return new THREE.MeshStandardMaterial({
                color: baseColor ?? color, emissive: color, emissiveIntensity: intensity,
                roughness: 0.4, metalness: 0.1
            });
        }

        // ---------- Lights ----------
        function setupLights() {

        // ---------- Room shell ----------
        function buildRoom() {
            const room = new THREE.Group();

            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(44, 28),
                new THREE.MeshStandardMaterial({ map: textures.floor, roughness: 0.9, metalness: 0.0 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            room.add(floor);

            // Ceiling
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(44, 28), standard(0x2a2230));
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 16;
            room.add(ceiling);

            const wallMat = new THREE.MeshStandardMaterial({ map: textures.wall, roughness: 0.95 });
            const makeWall = (w, h, pos, ry) => {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
                m.position.copy(pos); m.rotation.y = ry;
                m.receiveShadow = true;
                room.add(m);
                return m;
            };

            // Back wall (z = -14), left (x = -22), right (x = 22)
            makeWall(44, 16, new THREE.Vector3(0, 8, -14), 0);
            makeWall(28, 16, new THREE.Vector3(-22, 8, 0), Math.PI / 2);
            makeWall(28, 16, new THREE.Vector3(22, 8, 0), -Math.PI / 2);

            // Baseboard
            const baseGeo = new THREE.BoxGeometry(44, 1.2, 0.2);
            const baseMat = standard(0xf5f0e0);
            const b1 = new THREE.Mesh(baseGeo, baseMat); b1.position.set(0, 0.6, -13.9); room.add(b1);
            const b2 = new THREE.Mesh(new THREE.BoxGeometry(28, 1.2, 0.2), baseMat); b2.rotation.y = Math.PI / 2; b2.position.set(-21.9, 0.6, 0); room.add(b2);
            const b3 = new THREE.Mesh(new THREE.BoxGeometry(28, 1.2, 0.2), baseMat); b3.rotation.y = -Math.PI / 2; b3.position.set(21.9, 0.6, 0); room.add(b3);

            // Crown molding
            const crownGeo = new THREE.BoxGeometry(44, 0.4, 0.3);
            const crownMat = glossy(0xd4af37);
            const c1 = new THREE.Mesh(crownGeo, crownMat); c1.position.set(0, 15.8, -13.85); room.add(c1);

            buildWindow(room);
            buildFireplace(room);
            buildCeilingLamp(room);
            buildGarland(room);

            return room;
        }

        function buildWindow(room) {
            const group = new THREE.Group();
            group.position.set(-21.82, 7, 2);

            const woodMat = standard(0x5a3d28);
            const W = 6.2, H = 5.2, depth = 0.25;

            // Glass (with night-sky gradient + moon + stars)
            const glassTex = makeCanvasTexture(256, 256, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#0b1a3a'); g.addColorStop(1, '#1c3a5a');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#eaf3ff';
                for (let i = 0; i < 60; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 2 + 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#fdf6d8';
                ctx.beginPath(); ctx.arc(200, 62, 20, 0, Math.PI * 2); ctx.fill();
            });
            const glass = new THREE.Mesh(
                new THREE.PlaneGeometry(W, H),
                new THREE.MeshBasicMaterial({ map: glassTex })
            );
            glass.rotation.y = Math.PI / 2;
            group.add(glass);

            // Frame border (4 bars)
            const frameMat = woodMat;
            const tBar = new THREE.BoxGeometry(W + 0.5, 0.5, depth);
            const top = new THREE.Mesh(tBar, frameMat); top.position.y = H / 2 + 0.25; group.add(top);
            const bottom = new THREE.Mesh(tBar, frameMat); bottom.position.y = -H / 2 - 0.25; group.add(bottom);
            const sBar = new THREE.BoxGeometry(0.5, H + 0.5, depth);
            const left = new THREE.Mesh(sBar, frameMat); left.position.x = -W / 2 - 0.25; group.add(left);
            const right = new THREE.Mesh(sBar, frameMat); right.position.x = W / 2 + 0.25; group.add(right);

            // Cross bars
            const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.12, H, 0.18), frameMat);

            const hBar = new THREE.Mesh(new THREE.BoxGeometry(W, 0.12, 0.18), frameMat);
            hBar.rotation.y = Math.PI / 2; hBar.rotation.x = Math.PI / 2; group.add(hBar);

            // Sill
            const sill = new THREE.Mesh(new THREE.BoxGeometry(W + 1.2, 0.25, 1.0), woodMat);
            sill.position.set(0, -H / 2 - 0.6, 0.3);
            group.add(sill);

            // Cool moonlight
            const moonLight = new THREE.PointLight(0x88aaff, 1.2, 20, 2);
            moonLight.position.set(0, 2, 2.5);
            group.add(moonLight);
            registerLight('moon', moonLight, 1.2);

            room.add(group);
            registerInteractable(group, {
                id: 'window', name: '窗户 · Window',
                desc: '窗外飘着雪花，月亮静静挂在天上。🌙',
                activate: () => {}
            });
        }

        function buildFireplace(room) {
            const group = new THREE.Group();
            group.position.set(4, 0, -13);

            const brickMat = standard(0x7a3b2a);
            const dark = standard(0x4a2318);

            // Base

            base.position.set(0, 0.5, 0); group.add(base);

            // Two pillars

            const p1 = new THREE.Mesh(pillarGeo, brickMat); p1.position.set(-3, 4, 0); group.add(p1);
            const p2 = new THREE.Mesh(pillarGeo, brickMat); p2.position.set(3, 4, 0); group.add(p2);

            // Mantel top
            const mantel = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.6, 2), glossy(0x5a3d28));
            mantel.position.set(0, 7.6, 0); group.add(mantel);

            // Firebox
            const firebox = new THREE.Mesh(new THREE.BoxGeometry(5, 5.5, 1), dark);
            firebox.position.set(0, 3.2, -0.2); group.add(firebox);

            // Logs
            const logMat = standard(0x3a2410);
            const logs = new THREE.Group();
            for (let i = 0; i < 3; i++) {
                const l = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 3, 10), logMat);
                l.rotation.z = Math.PI / 2;
                l.rotation.y = (i - 1) * 0.3;
                l.position.set(0, 0.4 + i * 0.15, -0.15);
                logs.add(l);
            }
            logs.position.y = 0.6;
            group.add(logs);

            // Flames (animated)
            const flameMat = new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.9 });
            fireFlicker.flameMats = [{ mat: flameMat, base: 0.9 }];
            for (let i = 0; i < 3; i++) {
                const f = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.4, 12), flameMat);
                f.position.set((i - 1) * 0.6, 2.2, 0.1);
                group.add(f);
                fireFlicker.flames.push(f);
            }
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffd94a, transparent: true, opacity: 0.95 });
            const innerFlame = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.9, 10), innerMat);
            innerFlame.position.set(0, 2.0, 0.2);
            group.add(innerFlame);
            fireFlicker.flames.push(innerFlame);
            fireFlicker.flameMats.push({ mat: innerMat, base: 0.95 });

            // Fire light
            const fl = new THREE.PointLight(0xff7733, 3.5, 18, 2);
            fl.position.set(0, 2.5, 1.5);
            group.add(fl);
            fireFlicker.light = fl;
            fireFlicker.base = 3.5;

            room.add(group);
            registerInteractable(group, {
                id: 'fireplace', name: '壁炉 · Fireplace',

        }

        function buildCeilingLamp(room) {

            const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.4, 8), glossy(0xd4af37));
            rod.position.y = -0.7; group.add(rod);

        function buildGarland(room) {
            const garland = new THREE.Group();
            const pts = [
                new THREE.Vector3(-22, 13, -14), new THREE.Vector3(-8, 14.5, -14),
                new THREE.Vector3(8, 14.5, -14), new THREE.Vector3(22, 13, -14)
            ];
            const curve = new THREE.CatmullRomCurve3(pts);
            const tube = new THREE.Mesh(
                new THREE.TubeGeometry(curve, 60, 0.16, 8, false),
                standard(0x1f5f2a)
            );
            garland.add(tube);

            // String lights along garland
            const lightGeo = new THREE.SphereGeometry(0.22, 8, 8);
            const colors = [0xff5555, 0xffd94a, 0x55ff88, 0x55aaff, 0xffaa55];
            for (let i = 0; i <= 60; i++) {
                const t = i / 60;
                const p = curve.getPointAt(t);
                const m = new THREE.Mesh(lightGeo, emissive(colors[i % colors.length], 0.0));
                m.position.copy(p);
                m.position.y -= 0.1;
                m.userData = { phase: Math.random() * Math.PI * 2, color: colors[i % colors.length] };
                garland.add(m);
                treeLights.push(m);
            }
            room.add(garland);
        }

        // ---------- Christmas Tree ----------
        function buildTree() {
            const group = new THREE.Group();
            group.position.set(-15, 0, -5);

            // 圣诞树整体缩放倍数：调大 TREE_SCALE 即可放大整棵树（礼物不受影响）
            const TREE_SCALE = 1.4;
            const treeBody = new THREE.Group();
            treeBody.scale.setScalar(TREE_SCALE);
            group.add(treeBody);

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.6, 12), standard(0x5a3d28));
            trunk.position.y = 0.8; treeBody.add(trunk);

            const green = new THREE.MeshStandardMaterial({ color: 0x0f5a26, roughness: 0.7, emissive: 0x02150a, emissiveIntensity: 0.5 });
            const layers = [
                { y: 1.9, r: 2.8, h: 2.4 },
                { y: 3.6, r: 2.2, h: 2.2 },
                { y: 5.2, r: 1.7, h: 2.0 },
                { y: 6.7, r: 1.2, h: 1.8 },
            ];
            layers.forEach(l => {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(l.r, l.h, 24), green);
                cone.position.y = l.y;
                cone.castShadow = true;
                treeBody.add(cone);
            });

            // Ornaments
            const orbGeo = new THREE.SphereGeometry(0.22, 12, 12);
            const orbColors = [0xff3333, 0xffd94a, 0x3388ff, 0xff66cc, 0xffffff];
            for (let i = 0; i < 40; i++) {
                const y = 1.6 + Math.random() * 5.2;
                const norm = (y - 1.4) / 6;
                const r = (1 - norm) * 2.6 + 0.1;
                const a = Math.random() * Math.PI * 2;
                const m = new THREE.Mesh(orbGeo, glossy(orbColors[i % orbColors.length]));
                m.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
                treeBody.add(m);
            }

            // String lights (twinkling)
            const lightGeo = new THREE.SphereGeometry(0.14, 8, 8);
            const lightColors = [0xff6666, 0xffff88, 0x88ffaa, 0x88bbff, 0xffaa66];
            for (let i = 0; i < 350; i++) {
                const t = Math.random();
                const y = 1.5 + t * 5.5;
                const r = (1 - t) * 2.6 + 0.05;
                const a = t * 20 + Math.random() * 0.6;
                const m = new THREE.Mesh(lightGeo, emissive(lightColors[i % 5], 0.0));
                m.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
                m.userData = { phase: Math.random() * Math.PI * 2, color: lightColors[i % 5] };
                treeBody.add(m);
                treeLights.push(m);
            }

            // Star
            const starShape = new THREE.Shape();
            const pts = 5;
            for (let i = 0; i < pts * 2; i++) {
                const a = (i * Math.PI) / pts + Math.PI / 2;
                const rr = i % 2 === 0 ? 0.55 : 0.24;
                const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
                if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
            }
            starShape.closePath();
            const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.18, bevelEnabled: true, bevelSize: 0.04, bevelSegments: 1 });
            starGeo.center();
            const star = new THREE.Mesh(starGeo, emissive(0xffdd88, 1.2));
            star.position.y = 7.9;
            animParts.star = star;
            treeBody.add(star);

            // Gifts under tree
            buildGifts(group);

            registerInteractable(group, {
                id: 'tree', name: '圣诞树 · Christmas Tree',
                desc: '点击进入粒子圣诞树页面，体验手势与照片特效 🎄',
                activate: () => {
                    navOverlay.classList.add('show');
                    setTimeout(() => {
                        window.location.href = 'christmas_tree_touch%26gesture.html';
                    }, 900);
                }
            });
            return group;
        }

        }

        // ---------- Radio ----------

            const knob2 = knob.clone();
            knob2.position.set(0.05, 0.1, 0.42);

        // ---------- TV ----------
        function makeTVScreenOff() {
            return makeCanvasTexture(256, 160, (ctx, w, h) => {
                ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#1a2026'; ctx.fillRect(16, 14, w - 32, h - 28);
            });
        }
        function makeTVScreenOn() {
            return makeCanvasTexture(256, 160, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#1a3a5a'); g.addColorStop(1, '#0c1e30');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 50; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 1.5 + 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#ffd94a';
                ctx.font = 'bold 22px serif'; ctx.textAlign = 'center';
                ctx.fillText('MERRY', w / 2, h / 2 - 8);
                ctx.fillText('CHRISTMAS', w / 2, h / 2 + 20);
            });
        }

        function toggleTV() {
            const tv = animParts.tv;
            tv.on = !tv.on;
            tv.screen.material.map = tv.on ? tv.onTex : tv.offTex;

            tv.screen.material.needsUpdate = true;
            tv.tvLight.intensity = tv.on ? 2.6 : 0;
        }

        // ---------- Photo album ----------
        function makePhotoTexture(i) {
            const palettes = [
                ['#7a1f2b', '#d4af37'], ['#1f3a6b', '#7fb3d5'],
                ['#1f5a2a', '#a9dfbf'], ['#5a2a6b', '#e0b3ff']
            ];
            const [c1, c2] = palettes[i % palettes.length];
            return makeCanvasTexture(160, 200, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0, 0, w, h);
                g.addColorStop(0, c1); g.addColorStop(1, c2);
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#f7f3e8';
                ctx.fillRect(0, 0, w, 26);
                ctx.fillRect(0, h - 26, w, 26);
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath(); ctx.arc(w / 2, h / 2, 26, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = c2;
                ctx.beginPath(); ctx.arc(w / 2, h / 2, 14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                for (let s = 0; s < 20; s++) {
                    ctx.fillRect(Math.random() * w, 30 + Math.random() * (h - 60), 2, 2);
                }
            });
        }

        // ---------- Clock ----------
        function makeClockFace() {
            return makeCanvasTexture(200, 200, (ctx, w, h) => {
                ctx.fillStyle = '#f7f3e8';
                ctx.beginPath(); ctx.arc(w / 2, h / 2, 95, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#5a3d28'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(w / 2, h / 2, 95, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = '#3a2410';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                for (let i = 1; i <= 12; i++) {
                    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
                    ctx.font = 'bold 16px serif';
                    ctx.fillText(String(i), w / 2 + Math.cos(a) * 76, h / 2 + Math.sin(a) * 76);
                }
            });
        }
        function playChime() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                const ctx = new Ctx();
                [880, 660, 554].forEach((freq, i) => {
                    playBell(ctx, freq, ctx.currentTime + 0.1 + i * 0.5, 0.7);
                });
                setTimeout(() => ctx.close(), 2600);
            } catch (e) {}
        }

        // ---------- Photo frames (right wall) ----------
        // 五个预设照片：用 Canvas 程序化画出来的“内置照片”。
        // 若想换成真实本地照片，点击相框即可通过 <input type=file> 导入并覆盖。
        function makePresetFramePhoto(i) {
            return makeCanvasTexture(512, 384, (ctx, w, h) => {
                const cx = w / 2;
                // 每张不同的背景渐变
                const bgs = [
                    ['#1a2a55', '#33557a'],  // 雪人 冬夜
                    ['#0c1e30', '#14532d'],  // 圣诞树
                    ['#5a1620', '#8a1f2b'],  // 圣诞老人
                    ['#144d24', '#1f7a33'],  // 礼物
                    ['#0b1a3a', '#1c3a5a'],  // 冬夜村庄
                ];
                const [c1, c2] = bgs[i % bgs.length];
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, c1); g.addColorStop(1, c2);
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

                if (i === 0) { // 雪人
                    ctx.fillStyle = '#eef3ff'; ctx.fillRect(0, h * 0.75, w, h * 0.25);
                    const snow = (x, y, r) => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
                    snow(cx, h * 0.72, 62); snow(cx, h * 0.52, 46); snow(cx, h * 0.34, 34);
                    ctx.fillStyle = '#111'; ctx.fillRect(cx - 26, h * 0.16, 52, 14); ctx.fillRect(cx - 18, h * 0.22, 36, 8);
                    ctx.fillStyle = '#ff7722'; ctx.beginPath(); ctx.moveTo(cx, h * 0.34); ctx.lineTo(cx + 40, h * 0.36); ctx.lineTo(cx, h * 0.39); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#111';
                    [[-14, h * 0.31], [14, h * 0.31]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(cx + x, y, 5, 0, Math.PI * 2); ctx.fill(); });
                    for (let b = 0; b < 3; b++) { ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(cx, h * 0.55 + b * 16, 5, 0, Math.PI * 2); ctx.fill(); }
                } else if (i === 1) { // 圣诞树
                    ctx.fillStyle = '#f5f0e0'; ctx.fillRect(0, h * 0.8, w, h * 0.2);
                    ctx.fillStyle = '#5a3d28'; ctx.fillRect(cx - 16, h * 0.76, 32, h * 0.1);
                    const tri = (y, r, hh) => { ctx.fillStyle = '#0f5a26'; ctx.beginPath(); ctx.moveTo(cx - r, y); ctx.lineTo(cx + r, y); ctx.lineTo(cx, y - hh); ctx.closePath(); ctx.fill(); };
                    tri(h * 0.78, 150, 110); tri(h * 0.62, 122, 100); tri(h * 0.47, 92, 90);
                    ctx.fillStyle = '#ffd94a'; ctx.beginPath(); ctx.arc(cx, h * 0.18, 18, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ff3333';
                    for (let o = 0; o < 8; o++) { ctx.beginPath(); ctx.arc(cx + Math.cos(o) * 90, h * 0.6 + Math.sin(o * 2) * 40, 6, 0, Math.PI * 2); ctx.fill(); }
                } else if (i === 2) { // 圣诞老人
                    ctx.fillStyle = '#f5f0e0'; ctx.beginPath(); ctx.arc(cx, h * 0.9, 150, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#f0c8a0'; ctx.beginPath(); ctx.arc(cx, h * 0.45, 60, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#cc2233'; ctx.beginPath(); ctx.moveTo(cx - 70, h * 0.34); ctx.lineTo(cx + 70, h * 0.34); ctx.lineTo(cx + 15, h * 0.05); ctx.lineTo(cx - 15, h * 0.05); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + 5, h * 0.02, 20, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#111'; [[-20, h * 0.42], [20, h * 0.42]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(cx + x, y, 6, 0, Math.PI * 2); ctx.fill(); });
                    ctx.fillStyle = '#f0c8a0'; ctx.beginPath(); ctx.arc(cx, h * 0.52, 12, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(cx, h * 0.62, 34, 22, 0, 0, Math.PI * 2); ctx.fill();
                } else if (i === 3) { // 礼物
                    ctx.fillStyle = '#f5f0e0'; ctx.fillRect(0, h * 0.7, w, h * 0.3);
                    const gift = (x, y, s, col) => {
                        ctx.fillStyle = col; ctx.fillRect(x - s, y - s, s * 2, s * 2);
                        ctx.fillStyle = '#f5f0e0'; ctx.fillRect(x - s * 0.14, y - s, s * 0.28, s * 2); ctx.fillRect(x - s, y - s * 0.14, s * 2, s * 0.28);
                        ctx.fillStyle = '#d4af37'; ctx.fillRect(x - s * 0.2, y - s * 0.2, s * 0.4, s * 0.4);
                    };
                    gift(cx - 90, h * 0.58, 70, '#cc2233');
                    gift(cx + 80, h * 0.6, 55, '#2266cc');
                    gift(cx, h * 0.62, 40, '#22aa55');
                } else { // 冬夜村庄
                    ctx.fillStyle = '#fdf6d8'; ctx.beginPath(); ctx.arc(w * 0.8, h * 0.18, 30, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#eaf3ff';
                    for (let s = 0; s < 40; s++) { ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h * 0.6, 1.5, 0, Math.PI * 2); ctx.fill(); }
                    ctx.fillStyle = '#eef3ff'; ctx.fillRect(0, h * 0.78, w, h * 0.22);
                    ctx.fillStyle = '#1a1626'; ctx.fillRect(cx - 120, h * 0.5, 240, h * 0.28);
                    ctx.fillStyle = '#5a3d28'; ctx.beginPath(); ctx.moveTo(cx - 150, h * 0.5); ctx.lineTo(cx, h * 0.3); ctx.lineTo(cx + 150, h * 0.5); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#ffd94a'; ctx.fillRect(cx - 30, h * 0.62, 26, 26);
                    ctx.fillStyle = '#0f5a26';
                    [[-180, 50], [180, 40]].forEach(([x, r]) => { ctx.beginPath(); ctx.moveTo(cx + x, h * 0.72); ctx.lineTo(cx + x + r, h * 0.72); ctx.lineTo(cx + x, h * 0.42); ctx.closePath(); ctx.fill(); });
                }
                // 统一雪花点缀
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                for (let s = 0; s < 30; s++) { ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
            });
        }

        function buildFrames() {
            const container = new THREE.Group();
            const FRAME_W = 3.2, FRAME_H = 2.2, BORDER = 0.2, DEPTH = 0.15;
            const INNER_W = 2.9, INNER_H = 1.9;
            const wood = standard(0x6b4a2b);
            const positions = [
                { y: 8.6, z: -8 }, { y: 8.6, z: -4 }, { y: 8.6, z: 0 },
                { y: 8.6, z: 4 }, { y: 8.6, z: 8 },
            ];
            animParts.frames = [];

            positions.forEach((p, i) => {
                const group = new THREE.Group();
                group.position.set(21.85, p.y, p.z);
                group.rotation.y = -Math.PI / 2;

                const back = new THREE.Mesh(new THREE.BoxGeometry(FRAME_W, FRAME_H, 0.08), standard(0x1a1626));
                back.position.z = -0.04; group.add(back);

                const photoMat = new THREE.MeshBasicMaterial({ map: makePresetFramePhoto(i) });
                const photo = new THREE.Mesh(new THREE.PlaneGeometry(INNER_W, INNER_H), photoMat);
                photo.position.z = 0.02; group.add(photo);

                const tb = new THREE.BoxGeometry(FRAME_W + 2 * BORDER, BORDER, DEPTH);
                const top = new THREE.Mesh(tb, wood); top.position.y = FRAME_H / 2 + BORDER / 2; group.add(top);
                const bottom = new THREE.Mesh(tb, wood); bottom.position.y = -FRAME_H / 2 - BORDER / 2; group.add(bottom);
                const sb = new THREE.BoxGeometry(BORDER, FRAME_H + 2 * BORDER, DEPTH);
                const left = new THREE.Mesh(sb, wood); left.position.x = -FRAME_W / 2 - BORDER / 2; group.add(left);
                const right = new THREE.Mesh(sb, wood); right.position.x = FRAME_W / 2 + BORDER / 2; group.add(right);

                animParts.frames[i] = { photoMat, photo, innerW: INNER_W, innerH: INNER_H };
                registerInteractable(group, {
                    id: 'frame-' + i, name: '相框 · Picture ' + (i + 1),
                    desc: '点击可导入你的本地照片替换这张。🖼️',
                    activate: () => {
                        pendingFrameIndex = i;
                        document.getElementById('frame-photo-input').click();
                    }
                });
                container.add(group);
            });
            return container;
        }

        function applyFramePhoto(tex, index) {
            const f = animParts.frames && animParts.frames[index];
            if (!f) return;
            f.photoMat.map = tex;
            f.photoMat.color.set('#ffffff');
            f.photoMat.needsUpdate = true;
            const img = tex.image;
            const aspect = (img && img.width && img.height) ? img.width / img.height : f.innerW / f.innerH;
            const innerAspect = f.innerW / f.innerH;
            let w = f.innerW, h = f.innerH;
            if (aspect > innerAspect) h = f.innerW / aspect; else w = f.innerH * aspect;
            f.photo.scale.x = w / f.innerW;
            f.photo.scale.y = h / f.innerH;
        }
        function onFramePhotoSelected(e) {
            const file = e.target.files && e.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                new THREE.TextureLoader().load(ev.target.result, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    applyFramePhoto(tex, pendingFrameIndex);
                    showInfo('相框 · Picture ' + (pendingFrameIndex + 1), '照片已挂上墙！再点击可更换。🖼️');
                });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        // ---------- Snow / sparkles ----------
        function buildSparkles() {
            const count = 600;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const vel = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                pos[i * 3] = THREE.MathUtils.randFloatSpread(40);
                pos[i * 3 + 1] = Math.random() * 16;
                pos[i * 3 + 2] = THREE.MathUtils.randFloatSpread(24);
                vel[i] = Math.random() * 0.4 + 0.1;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('aVel', new THREE.BufferAttribute(vel, 1));
            const tex = makeCanvasTexture(32, 32, (ctx) => {
                const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                g.addColorStop(0, 'rgba(255,255,255,1)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g; ctx.fillRect(0, 0, 32, 32);
            });
            const mat = new THREE.PointsMaterial({
                map: tex, size: 0.35, transparent: true, opacity: 0.8,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            sparkles = new THREE.Points(geo, mat);
            return sparkles;
        }

        function updateSparkles(dt, t) {
            if (!sparkles) return;
            const pos = sparkles.geometry.attributes.position.array;
            const vel = sparkles.geometry.attributes.aVel.array;
            for (let i = 0; i < pos.length / 3; i++) {
                pos[i * 3 + 1] -= vel[i] * dt;
                pos[i * 3] += Math.sin(t * 2 + i) * dt * 0.3;
                if (pos[i * 3 + 1] < 0) { pos[i * 3 + 1] = 16; }
            }
            sparkles.geometry.attributes.position.needsUpdate = true;
        }

        // ---------- Audio: Jingle Bells (WebAudio) ----------
        let audioPlaying = false;
        function playJingleBells() {
            if (audioPlaying) return;
            audioPlaying = true;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                const ctx = new Ctx();
                const beat = 0.26;
                const melody = [
                    [76, 1], [76, 1], [76, 2],
                    [76, 1], [76, 1], [76, 2],
                    [76, 1], [79, 1], [72, 1.5], [74, 0.5], [76, 4],
                    [77, 1], [77, 1], [77, 1], [77, 0.5],
                    [77, 1], [76, 1], [76, 1], [76, 0.5], [76, 0.5],
                    [76, 1], [74, 1], [74, 1], [76, 1],
                    [74, 2], [79, 2]
                ];
                const start = ctx.currentTime + 0.06;
                let t = start;
                melody.forEach(([midi, beats]) => {
                    const freq = 440 * Math.pow(2, (midi - 69) / 12);
                    const dur = beats * beat;
                    playBell(ctx, freq, t, dur);
                    t += dur;
                });
                const totalMs = ((t - start) + 0.2) * 1000;
                setTimeout(() => { audioPlaying = false; ctx.close(); }, totalMs);
            } catch (e) { audioPlaying = false; }
        }
        function playBell(ctx, freq, start, dur) {
            const osc = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle'; osc.frequency.value = freq;
            osc2.type = 'sine'; osc2.frequency.value = freq * 2;
            const g2 = ctx.createGain(); g2.gain.value = 0.3;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.28, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
            osc.connect(gain);
            osc2.connect(g2).connect(gain);
            gain.connect(ctx.destination);
            osc.start(start); osc.stop(start + dur + 0.05);
            osc2.start(start); osc2.stop(start + dur + 0.05);
        }

        // ---------- Interactivity ----------
        function registerInteractable(group, cfg) {
            interactables.push({ group, ...cfg });
            group.userData.interactable = cfg.id;
            // mark all children for raycast
            group.traverse(o => { o.userData.interactableRoot = group; });
        }

        function getInteractableRoot(obj) {
            let o = obj;
            while (o) {
                if (o.userData && o.userData.interactableRoot) return o.userData.interactableRoot;
                o = o.parent;
            }
            return null;
        }

        function showInfo(name, desc) {
            infoName.textContent = name;
            infoDesc.textContent = desc;
            infoPanel.classList.add('show');
            if (infoTimeout) clearTimeout(infoTimeout);
            infoTimeout = setTimeout(() => infoPanel.classList.remove('show'), 4200);
        }

        function handleClick(e) {
            if (currentMode !== MODE.ORBIT) return;
            const dist = Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y);
            if (dist > 8) return;
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(interactables.map(i => i.group), true);
            if (hits.length) {
                const root = getInteractableRoot(hits[0].object);
                const entry = interactables.find(i => i.group === root);
                if (entry) {
                    entry.activate();
                    showInfo(entry.name, entry.desc);
                }
            }
        }

        function handleHover(e) {
            if (currentMode !== MODE.ORBIT) return;
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(interactables.map(i => i.group), true);
            const container = document.getElementById('canvas-container');
            if (hits.length) container.classList.add('grab-hover');
            else container.classList.remove('grab-hover');
        }

        function setupEvents() {
            const container = document.getElementById('canvas-container');
            container.addEventListener('pointerdown', onPointerDown);
            container.addEventListener('pointerup', onPointerUp);
            window.addEventListener('pointermove', onPointerMove);
            container.addEventListener('wheel', onWheel, { passive: false });
            document.getElementById('frame-photo-input').addEventListener('change', onFramePhotoSelected);
            document.getElementById('move-btn').addEventListener('click', toggleMoveMode);
            document.getElementById('save-pos-btn').addEventListener('click', () => {
                savePositions();
                showInfo('已保存位置', '当前所有物品位置已保存，刷新页面后保持。💾');
            });
            document.getElementById('reset-pos-btn').addEventListener('click', resetPositions);
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyF') { e.preventDefault(); toggleMode(); }
                if (e.code === 'KeyM') { toggleMoveMode(); }
                if (e.code === 'KeyE' && currentMode === MODE.FPS && fpsControls && fpsControls.isLocked) fpsInteract();
                if (moveModeActive && (e.code === 'KeyQ' || e.code === 'KeyE')) rotateMoveSelection(e.code === 'KeyQ' ? 1 : -1);
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ---------- Move mode ----------
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function setPointerFromEvent(e) {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }
        function pickMoveable() {
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(interactables.map(i => i.group), true);
            if (hits.length) {
                const root = getInteractableRoot(hits[0].object);
                return interactables.find(i => i.group === root) || null;
            }
            return null;
        }
        function updateMoveHighlight() {
            const target = moveSelected || moveHover;
            if (moveModeActive && target && moveRing) {
                const box = new THREE.Box3().setFromObject(target);
                const size = box.getSize(new THREE.Vector3());
                const r = Math.max(size.x, size.z) / 2 + 0.25;
                moveRing.visible = true;
                moveRing.position.set(target.position.x, 0.1, target.position.z);
                moveRing.scale.setScalar(Math.max(0.6, r));
            } else if (moveRing) {
                moveRing.visible = false;
            }
        }
        function startMoveDrag(e) {
            setPointerFromEvent(e);
            const entry = pickMoveable();
            if (entry) {
                moveSelected = entry.group;
                moveDrag.active = true;
                moveDrag.plane.set(UP, -moveSelected.position.y);
                raycaster.setFromCamera(pointer, camera);
                const pt = new THREE.Vector3();
                if (raycaster.ray.intersectPlane(moveDrag.plane, pt)) {
                    moveDrag.offset.copy(moveSelected.position).sub(pt);
                } else {
                    moveDrag.offset.set(0, 0, 0);
                }
            }
            updateMoveHighlight();
        }
        function moveDragUpdate(e) {
            setPointerFromEvent(e);
            if (!moveDrag.active || !moveSelected) return;
            raycaster.setFromCamera(pointer, camera);
            const pt = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(moveDrag.plane, pt)) {
                moveSelected.position.x = clamp(pt.x + moveDrag.offset.x, -21, 21);
                moveSelected.position.z = clamp(pt.z + moveDrag.offset.z, -13, 13);
            }
            updateMoveHighlight();
        }
        function endMoveDrag() {
            if (moveDrag.active) { moveDrag.active = false; refreshColliders(); savePositions(); }
        }
        function rotateMoveSelection(dir) {
            const target = moveSelected || moveHover;
            if (target) { target.rotation.y += dir * Math.PI / 12; refreshColliders(); savePositions(); }
        }
        function onPointerDown(e) {
            pointerDown.set(e.clientX, e.clientY);
            if (moveModeActive) startMoveDrag(e);
        }
        function onPointerMove(e) {
            if (moveModeActive) {
                if (moveDrag.active) { moveDragUpdate(e); return; }
                setPointerFromEvent(e);
                const entry = pickMoveable();
                moveHover = entry ? entry.group : null;
                updateMoveHighlight();
                return;
            }
            handleHover(e);
        }
        function onPointerUp(e) {
            if (moveModeActive) { endMoveDrag(); return; }
            handleClick(e);
        }
        function onWheel(e) {
            if (!moveModeActive) return;
            e.preventDefault();
            const target = moveSelected || moveHover;
            if (target) {
                target.position.y = clamp(target.position.y + (e.deltaY > 0 ? -0.3 : 0.3), 0, 14);
                refreshColliders();
                savePositions();
            }
        }
        function setMoveMode(on) {
            moveModeActive = on;
            const btn = document.getElementById('move-btn');
            const hint = document.getElementById('move-hint');
            const container = document.getElementById('canvas-container');
            if (on) {
                if (currentMode === MODE.FPS) exitFPS();
                controls.enabled = false;
                btn.classList.add('active');
                hint.classList.add('show');
                container.classList.add('move-mode');
            } else {
                controls.enabled = true;
                moveSelected = null;
                moveHover = null;
                moveDrag.active = false;
                btn.classList.remove('active');
                hint.classList.remove('show');
                container.classList.remove('move-mode');
                updateMoveHighlight();
            }
        }
        function toggleMoveMode() { setMoveMode(!moveModeActive); }

        // ---------- External GLB models ----------
        const GLB_MODELS = [
            { id: 'bookcase', name: '小书柜 · Little Bookcase', file: 'versions/assets/Little Bookcase by Don Carson - 74tXfxoDB9b.glb', pos: [-18, 0, -11], height: 4.2, desc: '从网络下载的 GLB 模型，可自由拖动。📚' },
            { id: 'bartable', name: '吧台桌 · Bar Table', file: 'versions/assets/Bar Table by Nick Slough - 5sbtN1v3sac.glb', pos: [8, 0, -2], height: 3.0, desc: '吧台桌🍹' },
            { id: 'vending', name: '自动售货机 · Vending Machine', file: 'versions/assets/Vending Machine.glb', pos: [-21, 0, 8], height: 5.0, rotationY: Math.PI / 2, desc: '自动售货机，投币买饮料。🥤' },
            { id: 'piano', name: '钢琴 · Piano', file: 'versions/assets/Piano by Bruno Oliveira - 5vbJ5vildOq.glb', pos: [-21, 0, -4], height: 3.5, rotationY: Math.PI / 2, desc: '一架优雅的钢琴。🎹' },
            { id: 'pine-tree', name: '小松树 · Pine Tree', file: 'versions/assets/ChristmasKit/Pine Tree.glb', pos: [-3, 0, -11.5], height: 2.5, desc: '一盆小松树。🌲' },
            { id: 'gifts', name: '礼物堆 · Gifts', file: 'versions/assets/ChristmasKit/Gifts.glb', pos: [-10, 0, 1], height: 1.0, desc: '成堆的圣诞礼物。🎁' },
            { id: 'santa-glb', name: '圣诞老人 · Santa', file: 'versions/assets/ChristmasKit/Santa.glb', pos: [0, 0, 10], height: 3.0, desc: '圣诞老人模型。🎅' },
            { id: 'bells', name: '铃铛 · Bells', file: 'versions/assets/ChristmasKit/Bells.glb', pos: [5.5, 7.6, -11.7], height: 0.6, desc: '金色的圣诞铃铛。🔔' },
            { id: 'branch', name: '冬青枝 · Branch', file: 'versions/assets/ChristmasKit/Branch.glb', pos: [2.5, 7.6, -11.7], height: 0.5, desc: '冬青树枝。🌿' },

            { id: 'decorations', name: '装饰串 · Decorations', file: 'versions/assets/ChristmasKit/Decorations.glb', pos: [-11, 0, 3], height: 0.7, desc: '一串装饰。🔵' },
            { id: 'socks-glb', name: '圣诞袜 · Socks', file: 'versions/assets/ChristmasKit/Socks.glb', pos: [6.5, 7.6, -11.7], height: 0.6, desc: '圣诞袜。🧦' },
            { id: 'stars', name: '星星 · Stars', file: 'versions/assets/ChristmasKit/Stars.glb', pos: [-16.5, 0, -3], height: 0.5, desc: '闪闪的星星。⭐' },
